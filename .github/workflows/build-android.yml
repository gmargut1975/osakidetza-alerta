name: Compilar app Android

# Genera el APK de «Plazos Osakidetza» y lo publica como versión (Release) del
# repositorio. El enlace fijo para descargar siempre la última es:
#   https://github.com/gmargut1975/osakidetza-alerta/releases/latest/download/plazos-osakidetza.apk
#
# Firma: con los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD y
# ANDROID_KEY_ALIAS (Settings > Secrets and variables > Actions). Sin ellos se
# compila una versión de pruebas firmada con una clave temporal, que no se
# puede actualizar encima de otra: habría que desinstalar antes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "src/app.html"
      - "index.html"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    env:
      VERSION: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar la web de la app
        run: PLAZOS_APP_VERSION="$VERSION" npm run prepare-www

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#c8102e' --iconBackgroundColorDark '#c8102e' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#121417'

      - name: Ajustar el proyecto (motor de segundo plano, permisos, versión)
        run: |
          node - <<'JS'
          const fs = require("fs");
          const gradle = "android/app/build.gradle";
          let g = fs.readFileSync(gradle, "utf8");
          const lib = "'../../node_modules/@capacitor/background-runner/android/src/main/libs'";
          if (!g.includes("background-runner")) {
            if (/dirs\s+'\.\.\/capacitor-cordova-android-plugins\/src\/main\/libs',\s*'libs'/.test(g)) {
              g = g.replace(/dirs\s+'\.\.\/capacitor-cordova-android-plugins\/src\/main\/libs',\s*'libs'/, (m) => `${m}, ${lib}`);
            } else {
              g += `\nrepositories {\n    flatDir {\n        dirs ${lib}, 'libs'\n    }\n}\n`;
            }
          }
          g = g.replace(/versionCode\s+\d+/, `versionCode ${process.env.GITHUB_RUN_NUMBER}`).replace(/versionName\s+"[^"]*"/, `versionName "${process.env.VERSION}"`);
          fs.writeFileSync(gradle, g);

          const manifest = "android/app/src/main/AndroidManifest.xml";
          let m = fs.readFileSync(manifest, "utf8");
          const perms = [
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
            '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
            '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />',
            '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ].filter((p) => !m.includes(p.split('"')[1]));
          m = m.replace("</manifest>", `    ${perms.join("\n    ")}\n</manifest>`);
          fs.writeFileSync(manifest, m);
          JS
          npx cap sync android
          grep -n "background-runner\|versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android-app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plazos.jks"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/plazos.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-plazos}" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/plazos-osakidetza.apk"
          else
            echo "::warning::Sin clave de firma en los secretos: se genera un APK de pruebas."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/plazos-osakidetza.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/plazos-osakidetza.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: plazos-osakidetza-${{ env.VERSION }}
          path: plazos-osakidetza.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}
          name: App Android ${{ env.VERSION }}
          make_latest: "true"
          files: plazos-osakidetza.apk
          body: |
            Descarga **plazos-osakidetza.apk** en el móvil y ábrelo para instalar (Android pedirá permitir instalar apps de esta fuente).
            ${{ env.HAS_KEY == 'true' && 'Versión firmada: se instala encima de la anterior sin perder tus datos.' || 'Versión de pruebas (sin clave de firma): para instalarla encima de otra hay que desinstalar antes.' }}
