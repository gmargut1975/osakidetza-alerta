name: Comprobar fuentes oficiales
on: { schedule: [{ cron: "*/30 * * * *" }], workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: check-sources, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Navegador sin interfaz para leer la aplicación del concurso de
      # traslados (CTAP), que no se puede consultar con una simple descarga.
      - name: Recuperar navegador de la caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48.2
      - name: Instalar Playwright
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Comprobar fuentes
        run: node scripts/check-sources.mjs
      - name: Guardar resultado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain data/source-monitor.json data/feed.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/source-monitor.json data/feed.json
            git commit -m "Actualizar comprobacion de fuentes oficiales"
            git pull --rebase --autostash || true
            git push
          else
            echo "Sin cambios en los datos"
          fi
