name: Comprobar fuentes oficiales
on: { schedule: [{ cron: "*/30 * * * *" }], workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: check-sources, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Comprobar fuentes
        run: node scripts/check-sources.mjs
      - name: Guardar resultado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain data/source-monitor.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/source-monitor.json
            git commit -m "Actualizar comprobacion de fuentes oficiales"
            git push
          else
            echo "Sin cambios en data/source-monitor.json"
          fi
